<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make-Ready Sequencing Demo Board</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #101418;
      color: #eef2f6;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(720px, calc(100vw - 32px));
      border: 1px solid #2a333d;
      border-radius: 8px;
      padding: 28px;
      background: #151b21;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      line-height: 1.55;
      color: #b8c2cc;
    }

    code {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Make-ready sequencing demo board</h1>
    <p>
      Stage 1 placeholder. Serve this file locally to verify static board
      hosting before the real Stage 3 board is built.
    </p>
    <p>
      Expected local URL: <code>http://localhost:8080</code>
    </p>
  </main>
</body>
</html>
