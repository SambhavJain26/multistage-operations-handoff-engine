<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make-Ready Sequencing Demo Board</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1116;
      --panel: #151b22;
      --panel-2: #1b232c;
      --border: #2b3642;
      --text: #eef3f8;
      --muted: #aab6c2;
      --quiet: #748392;
      --green: #2fbf71;
      --amber: #f0ad3d;
      --red: #f05d5e;
      --blue: #6ab7ff;
      --shadow: rgba(0, 0, 0, 0.32);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button,
    select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #223140;
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      background: #2a3b4c;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(106, 183, 255, 0.55);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: -80px;
      z-index: 10;
      padding: 10px 14px;
      background: var(--blue);
      color: #04111d;
      border-radius: 6px;
      transition: top 120ms ease-out;
    }

    .skip-link:focus {
      top: 16px;
    }

    .page {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
      padding: clamp(20px, 4vw, 40px) 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subhead {
      margin-top: 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .badge {
      align-self: start;
      border: 1px solid rgba(240, 173, 61, 0.5);
      color: #ffd28b;
      background: rgba(240, 173, 61, 0.12);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-strip {
      display: none;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--amber);
      border-radius: 6px;
      padding: 10px 12px;
      background: #1b1f23;
      color: #ffd28b;
      font-size: 14px;
    }

    .status-strip.visible {
      display: block;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0 20px;
    }

    .metric {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      box-shadow: 0 12px 28px var(--shadow);
    }

    .metric span {
      display: block;
      color: var(--quiet);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric strong {
      display: block;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 28px var(--shadow);
      overflow: hidden;
    }

    .card.red {
      border-color: rgba(240, 93, 94, 0.7);
    }

    .card.amber {
      border-color: rgba(240, 173, 61, 0.65);
    }

    .card.green {
      border-color: rgba(47, 191, 113, 0.5);
    }

    .card-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .unit {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .address,
    .vendor,
    .latest {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .age {
      min-width: 112px;
      text-align: right;
    }

    .age strong {
      display: block;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .age span {
      color: var(--quiet);
      font-size: 12px;
    }

    .red .age strong {
      color: #ff797a;
    }

    .amber .age strong {
      color: #ffc15f;
    }

    .green .age strong {
      color: #61d992;
    }

    .card-body {
      padding: 16px;
    }

    .stage-name {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .fact {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      background: var(--panel-2);
    }

    .fact span {
      display: block;
      color: var(--quiet);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .fact strong {
      font-size: 16px;
    }

    .stage-strip {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 4px;
      margin: 14px 0;
    }

    .stage-dot {
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #202832;
      color: var(--quiet);
      font-size: 13px;
      display: grid;
      place-items: center;
    }

    .stage-dot.complete,
    .stage-dot.skipped {
      background: rgba(47, 191, 113, 0.14);
      color: #76e2a4;
    }

    .stage-dot.active {
      background: rgba(106, 183, 255, 0.16);
      color: #9fd1ff;
      border-color: rgba(106, 183, 255, 0.55);
    }

    .stage-dot.awaiting_approval {
      background: rgba(240, 173, 61, 0.16);
      color: #ffd28b;
      border-color: rgba(240, 173, 61, 0.58);
    }

    .approval-note {
      margin: 10px 0 0;
      border: 1px solid rgba(240, 173, 61, 0.46);
      border-radius: 6px;
      padding: 9px 10px;
      background: rgba(240, 173, 61, 0.1);
      color: #ffd28b;
      font-size: 13px;
      line-height: 1.35;
    }

    .manual {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: 12px;
    }

    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111820;
      color: var(--text);
      padding: 0 10px;
    }

    .manual button {
      padding: 0 14px;
      background: #28533d;
      border-color: rgba(47, 191, 113, 0.55);
      font-weight: 700;
    }

    .latest {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .history {
      margin-top: 16px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
    }

    .history strong {
      display: block;
      color: var(--text);
      margin-bottom: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 32px));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      background: #111820;
      color: var(--text);
      box-shadow: 0 18px 40px var(--shadow);
      display: none;
      z-index: 20;
    }

    .toast.visible {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      header,
      .cards,
      .metrics {
        grid-template-columns: 1fr;
      }

      .badge {
        justify-self: start;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100vw - 20px, 1280px);
        padding-top: 16px;
      }

      .card-top,
      .manual,
      .facts {
        grid-template-columns: 1fr;
      }

      .age {
        text-align: left;
      }

      .stage-strip {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#turns">Skip to turns</a>
  <div class="page">
    <header>
      <div>
        <h1>Make-ready sequencing board</h1>
        <div class="subhead" id="headline">Loading live demo state.</div>
      </div>
      <div class="badge" id="demo-badge">DEMO DATA - Cedar Ridge is fictional</div>
    </header>

    <div class="status-strip" id="connection-status" role="status"></div>

    <section class="metrics" aria-label="Board metrics">
      <div class="metric"><span>Units in turn</span><strong id="metric-turns">--</strong></div>
      <div class="metric"><span>Burning now</span><strong id="metric-burn">$--</strong></div>
      <div class="metric"><span>Vendor reply rate</span><strong id="metric-reply">--%</strong></div>
      <div class="metric"><span>Auto-handled</span><strong id="metric-auto">--%</strong></div>
    </section>

    <main id="turns" class="cards" aria-live="polite"></main>

    <section class="history" aria-label="Turn history">
      <strong>Turn history</strong>
      Collecting from day one. First report at 30 days.
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const API_BASE = "http://localhost:5678/webhook";
    const DEFAULT_TOKEN = "local-stage-3-demo-token";
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get("token");
    const token = tokenFromUrl || localStorage.getItem("make_ready_board_token") || DEFAULT_TOKEN;
    if (tokenFromUrl) localStorage.setItem("make_ready_board_token", tokenFromUrl);

    const state = {
      data: null,
      loading: false,
      busyStageId: null,
      timer: null,
    };

    const els = {
      headline: document.querySelector("#headline"),
      badge: document.querySelector("#demo-badge"),
      status: document.querySelector("#connection-status"),
      turns: document.querySelector("#turns"),
      toast: document.querySelector("#toast"),
      metricTurns: document.querySelector("#metric-turns"),
      metricBurn: document.querySelector("#metric-burn"),
      metricReply: document.querySelector("#metric-reply"),
      metricAuto: document.querySelector("#metric-auto"),
    };

    function money(value) {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(value || 0);
    }

    function ageLabel(turn) {
      if (turn.hours_at_stage >= 48) return `${Math.round(turn.days_at_stage * 10) / 10}d`;
      return `${Math.round(turn.hours_at_stage * 10) / 10}h`;
    }

    function statusSymbol(status) {
      if (status === "complete") return "D";
      if (status === "skipped") return "S";
      if (status === "active") return "A";
      if (status === "awaiting_approval") return "W";
      if (status === "cancelled") return "X";
      return "P";
    }

    function latestText(event) {
      if (!event) return "No events yet.";
      const when = event.created_at ? new Date(event.created_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
      return `${event.event_type.replaceAll("_", " ")} via ${event.channel || "system"}${when ? ` at ${when}` : ""}${event.text ? ` - ${event.text}` : ""}`;
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("visible"), 5200);
    }

    function setStatus(message, visible = true) {
      els.status.textContent = message;
      els.status.classList.toggle("visible", visible);
    }

    function render(data, stale = false) {
      state.data = data;
      localStorage.setItem("make_ready_board_last_state", JSON.stringify(data));
      els.badge.textContent = data.demo?.label || "DEMO DATA - Cedar Ridge is fictional";
      els.headline.textContent = `${data.metrics.active_turns} units in turn - ${money(data.metrics.dollars_burning_now)} burning right now${stale ? " - last known state" : ""}`;
      els.metricTurns.textContent = data.metrics.active_turns;
      els.metricBurn.textContent = money(data.metrics.dollars_burning_now);
      els.metricReply.textContent = `${data.metrics.vendor_reply_rate}%`;
      els.metricAuto.textContent = `${data.metrics.auto_handled_rate}%`;
      els.turns.innerHTML = data.turns.map(renderCard).join("");
      els.turns.querySelectorAll("[data-mark-stage]").forEach(button => {
        button.addEventListener("click", () => markDone(button.dataset.markStage));
      });
    }

    function renderCard(turn) {
      const incompleteStages = turn.stages.filter(stage => !["complete", "skipped"].includes(stage.status));
      const activeStage = turn.current_stage;
      const options = incompleteStages.map(stage => `<option value="${stage.id}"${stage.id === activeStage.id ? " selected" : ""}>${stage.stage_name}</option>`).join("");
      const strip = turn.stages.map(stage => `<span class="stage-dot ${stage.status}" title="${stage.stage_name} - ${stage.status}">${statusSymbol(stage.status)}</span>`).join("");
      const pendingApproval = activeStage.status === "awaiting_approval"
        ? `<div class="approval-note">Manager approval pending. The next vendor has not been contacted.</div>`
        : "";
      return `
        <article class="card ${turn.health}">
          <div class="card-top">
            <div>
              <h2 class="unit">Unit ${turn.unit_label}</h2>
              <div class="address">${turn.property_address}</div>
            </div>
            <div class="age" aria-label="${ageLabel(turn)} at stage">
              <strong>${ageLabel(turn)}</strong>
              <span>at stage</span>
            </div>
          </div>
          <div class="card-body">
            <p class="stage-name">${activeStage.stage_name}</p>
            <div class="vendor">Assigned: ${activeStage.assigned_vendor}</div>
            ${pendingApproval}
            <div class="facts">
              <div class="fact"><span>Days vacant</span><strong>${turn.days_vacant}</strong></div>
              <div class="fact"><span>Rent burned</span><strong>${money(turn.dollars_burned)}</strong></div>
            </div>
            <div class="stage-strip" aria-label="Stage status strip">${strip}</div>
            <div class="manual">
              <label>
                <span class="sr-only">Stage to mark done</span>
                <select aria-label="Stage to mark done">${options}</select>
              </label>
              <button data-card-stage="${activeStage.id}" data-mark-stage="${activeStage.id}" ${state.busyStageId ? "disabled" : ""}>Mark done</button>
            </div>
            <div class="latest">${latestText(turn.latest_event)}</div>
          </div>
        </article>
      `;
    }

    async function loadBoard() {
      if (state.loading) return;
      state.loading = true;
      try {
        const response = await fetch(`${API_BASE}/board?token=${encodeURIComponent(token)}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Board API returned ${response.status}`);
        const data = await response.json();
        setStatus("", false);
        render(data, false);
      } catch (error) {
        const cached = localStorage.getItem("make_ready_board_last_state");
        if (cached && !state.data) render(JSON.parse(cached), true);
        setStatus(`Reconnecting to board API. Showing last-known state. ${error.message}`);
      } finally {
        state.loading = false;
      }
    }

    async function markDone(stageId) {
      const card = document.querySelector(`[data-mark-stage="${stageId}"]`)?.closest(".card");
      const selectValue = card?.querySelector("select")?.value || stageId;
      state.busyStageId = selectValue;
      try {
        const body = new URLSearchParams();
        body.set("stage_id", selectValue);
        body.set("actor_id", "board-manager");
        body.set("channel", "board");
        const response = await fetch(`${API_BASE}/stage/complete?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const payload = await response.json();
        if (!response.ok) {
          showToast(payload.reason || payload.message || `Stage completion failed with ${response.status}`);
        } else {
          showToast(payload.message || "Stage marked done.");
        }
        await loadBoard();
      } catch (error) {
        showToast(`Could not mark done. ${error.message}`);
        setStatus("Reconnecting to board API. Stage action did not complete.");
      } finally {
        state.busyStageId = null;
      }
    }

    loadBoard();
    state.timer = window.setInterval(loadBoard, 10000);
  </script>
</body>
</html>
